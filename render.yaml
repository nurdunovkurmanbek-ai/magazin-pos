# Render.com Blueprint — https://render.com/docs/blueprint-spec
#
# Колдонуу: Render → New → Blueprint → бул репозиторийди тандоо.
# Render render.yaml'ды окуп, базаны жана веб-сервисти өзү түзөт.
#
# Blueprint түзүлгөндө Render эки купуя сөздү (sync: false) сурайт —
# аларды README'дин «Render.com'го жайгаштыруу» бөлүмүнөн кара.

databases:
  - name: magazin-pos-db
    databaseName: magazin_pos
    user: magazin
    plan: free
    region: frankfurt

services:
  - type: web
    name: magazin-pos
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: magazin-pos-db
          property: connectionString

      # Купуя сөздөр — Blueprint түзүлгөндө Render сурайт (32+ символ)
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: API_PREFIX
        value: /api/v1
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      - key: TRUST_PROXY
        value: "true"

      # Биринчи ишке киргенде admin/cashier + demo товарларды түзөт.
      # Идемпотенттүү, бирок база толгондон кийин "false" кылса болот.
      - key: RUN_SEED
        value: "true"
