name: magazin-pos-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: magazin_pos_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-magazin_pos}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-magazin_pos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: magazin_pos_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-magazin_pos}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3001}
      API_PREFIX: /api/v1
      SERVE_FRONTEND: "true"
      FRONTEND_DIST: /app/frontend/dist
      TRUST_PROXY: "true"
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-true}
    volumes:
      - app_uploads:/app/backend/uploads
      - app_backups:/app/backend/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_prod:
  app_uploads:
  app_backups:
